groups:
  - name: api-alertas
    rules:
      - alert: APICaida
        expr: up{job="mi-api"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "La API no responde al scraping"

      - alert: TasaErroresAlta
        expr: sum(rate(http_requests_total{status=~"5.."}[1m])) / sum(rate(http_requests_total[1m])) > 0.2
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Más del 20% de los requests terminan en error 5xx"

      - alert: LatenciaP95Alta
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[1m]))) > 2
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "La latencia p95 supera los 2 segundos"
